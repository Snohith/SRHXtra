services:
  db:
    image: postgres:16-alpine
    container_name: srh-news-db
    restart: unless-stopped
    ports:
      # Loopback-only: the database is a local dev dependency, not a LAN service.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-srh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-srh_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-srh_news}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-srh} -d ${POSTGRES_DB:-srh_news}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
