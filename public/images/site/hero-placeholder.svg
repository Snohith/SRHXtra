<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SRHXtra hero graphic</title>
  <desc id="desc">Dark orange abstract brand graphic for the SRHXtra homepage.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#171a21" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.15" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)" />
  <circle cx="300" cy="160" r="260" fill="url(#glow)" />
  <circle cx="1280" cy="720" r="320" fill="#f97316" fill-opacity="0.15" />
  <text x="120" y="760" fill="#f8fafc" font-family="Arial, sans-serif" font-size="84" font-weight="700">
    SRHXtra
  </text>
</svg>
