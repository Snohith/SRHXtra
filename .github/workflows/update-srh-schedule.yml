name: Sync Official SRH Data

on:
  workflow_dispatch:
    inputs:
      season:
        description: IPL season year override, for example 2026
        required: false
        type: string
      dry_run:
        description: Fetch and validate without writing or committing
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-official-srh-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Sync official SRH data
        shell: bash
        run: |
          args=()

          if [ -n "${{ github.event.inputs.season }}" ]; then
            args+=(--season "${{ github.event.inputs.season }}")
          fi

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi

          node scripts/sync-official-data.mjs "${args[@]}"

      - name: Commit synced data files
        if: github.event.inputs.dry_run != 'true'
        shell: bash
        run: |
          if git diff --quiet -- content/data/schedule.json content/data/squad.json content/data/official-news-feed.json content/data/match-coverage-sources.json content/data/points-table.json content/news content/gallery/albums; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content/data/schedule.json content/data/squad.json content/data/official-news-feed.json content/data/match-coverage-sources.json content/data/points-table.json content/news content/gallery/albums
          git commit -m "chore(data): sync official SRH data"
          git push
